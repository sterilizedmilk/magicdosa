[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magicdosa"
version = "0.1.0.dev0"
description = "magicdosa training: reads agent-core's Arrow shards, trains the policy/value nets, exports ONNX"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyarrow",
    "protobuf",
]

[project.optional-dependencies]
# onnxscript: the torch.export-based ONNX exporter; onnxruntime: the export round-trip test (no wheel for Python 3.15
# yet, so the training environment runs on 3.14 or older; see docs/python-training.md)
train = ["torch", "onnx", "onnxscript", "onnxruntime"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["magicdosa*"]
