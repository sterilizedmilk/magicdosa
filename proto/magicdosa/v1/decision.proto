// Decision request and response (design: protocol 결정 요청 / 결정 응답 / 사건 동기화 / 재현성; 행동 스키마;
// 결정 모듈 구조 "결정 주체 원칙"; 평가 방법 > 폴백 검증; Q6–Q9, Q14).
syntax = "proto3";

package magicdosa.v1;

import "magicdosa/v1/common.proto";
import "magicdosa/v1/observation.proto";

option java_package = "magicdosa.protocol.v1";
option java_multiple_files = true;

// Sent by the adapter whenever an agent seat must decide. Every decision type goes through this request, including
// mana payment and trigger order (design: 결정 주체 원칙); the adapter never answers on its own except as an
// unintended fallback (DecisionRecord).
//
// Priority stop rule (설계 검토 2, Q14; mana abilities counted since 2026-11-06): a PRIORITY request is sent only when
// at least one candidate other than pass exists. Mana abilities count: mana is made in advance into the pool, so
// activating one is a priority action. Other priority points are passed by the engine and reported as PassPriority
// events with Event.engine_handled. agent-core, not the protocol, decides how much to search at a stop.
message DecisionRequest {
  uint32 protocol_version = 1;
  string game_id = 2;
  uint64 decision_id = 3;           // increasing per game; links request, response and log record
  uint32 seat = 4;                  // deciding player
  // Event sequence number (of this seat's stream) the request is asked against: agent-core waits until its shadow
  // game has applied every event up to and including this one before searching.
  uint64 applied_seq = 5;
  // Seed for agent-core's search randomness (design: 재현성), so a game can be reproduced across two JVMs.
  uint64 seed = 6;
  DecisionType type = 7;
  Observation observation = 8;      // the deciding seat's view only; never Privileged (Q11)
  repeated Candidate candidates = 9; // legal actions from the engine; agent-core never invents candidates
  SelectionConstraints constraints = 10;
  DecisionContext context = 11;
  // Earlier answers to this same decision that the engine refused, oldest first (Q15). A refused answer is not a
  // fallback: the adapter asks again with a new decision_id and the refusals listed here. After a few refusals the
  // adapter gives up and records an unintended fallback (FALLBACK_REASON_ILLEGAL_ACTION).
  repeated Rejection rejections = 12;
  // The player whose decision this is when it is not `seat`: `seat` controls that player (Emrakul, the Promised End;
  // 2026-11-06, deck item 4). The observation is still `seat`'s view; what the controlled player sees is shown to
  // `seat` through reveal events. Unset (or equal to `seat`) otherwise.
  optional uint32 acting_seat = 13;
}

message Rejection {
  uint64 decision_id = 1;           // the refused request
  repeated uint32 chosen = 2;       // the refused selection (indices into the candidates, which are unchanged)
  string reason = 3;                // the engine's reason, for debugging only (not encoded)
}

// How many candidates to pick and whether order matters (design: "선택 제약(최소·최대 개수, 순서 여부)").
// Single choice: min = max = 1. Multi-selects are answered one step at a time with an explicit "done" (Q9).
// MANA_PAYMENT asks for one payment step per request (min = max = 1): which pool mana pays next, or, for a cost paid
// while an ability resolves (605.3a), which mana ability to activate; DecisionContext.mana_cost is what is left.
// TODO(design) Q18: one request per step, because each step changes the next step's candidates.
//
// Pair selections (attackers, blockers) also carry the rules that make a combination legal, which single candidates
// cannot show (Q15): creatures that must attack if able, menace-like minimum blockers, how many attackers a blocker
// may block. The engine can still refuse a combination these rules do not cover (see DecisionRequest.rejections).
message SelectionConstraints {
  uint32 min = 1;
  uint32 max = 2;
  bool ordered = 3;
  // Objects that must appear in at least one chosen pair (e.g. a creature that attacks each combat if able).
  repeated uint64 required_ids = 4;
  // Per-object limits on the chosen pairs that include it. Objects not listed have no limit beyond min/max.
  repeated PairLimit pair_limits = 5;
}

message PairLimit {
  uint64 id = 1;
  // If the object is in any chosen pair, it must be in at least this many (menace: blocked by two or more). 0 = none.
  uint32 min_if_any = 2;
  // At most this many chosen pairs include it (an attacker attacks one defender; a blocker blocks one attacker
  // unless it can block more). 0 = no limit.
  uint32 max = 3;
}

// What the decision is about, for non-priority choices.
message DecisionContext {
  uint64 source_id = 1;             // spell / ability being cast, activated or resolved
  oneof key {
    SpellKey spell = 2;
    AbilityKey ability = 3;
  }
  string mana_cost = 4;             // MANA_PAYMENT: the cost still to pay, e.g. "{1}{R}"
  string engine_prompt = 5;         // engine's own wording, for debugging only (not encoded)
  // The spell or ability being cast or activated, as chosen so far (casting order 601.2: modes, X and costs, targets,
  // then payment). Its card is already on the stack but it is not a stack item yet.
  repeated ObjectRef targets = 6;
  repeated uint32 modes = 7;
  optional int64 x = 8;
  repeated ManaUnit paid = 9;       // MANA_PAYMENT: mana spent on it so far (colors count for e.g. Prismatic Ending)
  DamageAssignment damage = 10;     // DAMAGE_ASSIGNMENT
}

// One step of dividing a source's combat damage (DAMAGE_ASSIGNMENT; source_id is the damage source).
message DamageAssignment {
  ObjectRef recipient = 1;          // the blocker (or attacker) this request assigns damage to
  uint32 total = 2;                 // the source's damage
  uint32 remaining = 3;             // not assigned yet
  bool trample = 4;
  repeated DamageShare lethal = 5;  // lethal damage of each recipient now (damage already marked, deathtouch counted)
  repeated DamageShare engine_default = 6; // the engine's own division (player: ObjectRef.player_seat)
}

message DamageShare {
  ObjectRef to = 1;
  uint32 amount = 2;
}

// One legal action. Objects are referenced by entity ID (design: "후보 목록(엔티티 ID 참조)").
message Candidate {
  oneof action {
    PlayLandCandidate play_land = 1;
    CastSpellCandidate cast_spell = 2;
    ActivateAbilityCandidate activate_ability = 3;
    PassCandidate pass = 4;
    ObjectRef target = 5;
    Attack attack = 6;              // (creature, attacked player / planeswalker / battle) pair
    Block block = 7;
    OptionCandidate option = 8;
    uint64 card_id = 9;             // CHOOSE_CARDS, BOTTOM_CARDS
    ManaSourceCandidate mana_source = 10;
    PoolMana pool_mana = 11;        // MANA_PAYMENT: spend this mana from the pool
    uint64 triggered_ability_id = 12; // TRIGGER_ORDER: ID issued when the ability triggered
    bool keep = 13;                 // MULLIGAN: true = keep, false = mulligan
    bool play = 14;                 // PLAY_OR_DRAW: true = play first
    SideboardSwap sideboard_swap = 15;
    bool pay_life = 16;             // MANA_PAYMENT: pay one Phyrexian shard with 2 life
    string named_oracle_id = 17;    // NAME: a card name, by the card's oracle_id
    string named_type = 18;         // NAME: a type, e.g. a creature type
  }
}

message PlayLandCandidate {
  uint64 card_id = 1;
  CardFaceKey land = 2;             // Q2: (oracle_id, face)
}

message CastSpellCandidate {
  uint64 card_id = 1;
  SpellKey spell = 2;               // card face + cast method (Q2)
}

message ActivateAbilityCandidate {
  uint64 source_id = 1;
  AbilityKey ability = 2;
  bool mana_ability = 3;            // makes mana into the pool; counts as a non-pass candidate (Q14, 2026-11-06)
}

message PassCandidate {
}

// A mode, X value or other enumerated choice.
message OptionCandidate {
  uint32 index = 1;                 // mode index (0-based, oracle order) or engine option index
  optional int64 x = 2;             // set for X-value choices
  string label = 3;                 // engine text, for debugging only
}

// MANA_PAYMENT: one mana source that can contribute to the remaining cost (Q6). A mana ability that chooses a color
// gives one candidate per color. Fully identical sources (same card, same state, e.g. several basic Mountains) are
// one candidate listing all of them; the adapter taps the first unused one.
message ManaSourceCandidate {
  repeated uint64 source_ids = 1;
  AbilityKey ability = 2;
  repeated ManaUnit produced = 3;
}

// Between games: bring `in` from the sideboard and take `out` from the current deck (2026-11-06: sideboarding is
// decided by agent-core). One swap per SIDEBOARD request, min = max = 1, with PassCandidate as "done"; the next
// request lists the swaps the changed deck allows. TODO(design) Q18.
message SideboardSwap {
  string in_oracle_id = 1;
  string out_oracle_id = 2;
}

// agent-core's answer (Q9). One request, one response; the response records every selection step.
message DecisionResponse {
  string game_id = 1;
  uint64 decision_id = 2;
  // The final selection: the steps' choices in order, without "done", as indices into DecisionRequest.candidates.
  // The adapter passes only this to the engine.
  repeated uint32 chosen = 3;
  // One step per pick; a single-pick decision has one step. Kept in the log from the start, because visit ratios
  // exist only at play time (design: 학습 전략과 보상 "프로토타입 우선"). Each step is one Arrow sample.
  repeated DecisionStep steps = 4;
}

// One pick of a (possibly multi-select) decision. Order is free; search merges branches that reach the same set
// (transposition detection).
message DecisionStep {
  // This step's candidates: the request's candidates still available (already chosen ones removed; for MANA_PAYMENT
  // the sources that can still contribute) plus "done" where the selection may stop.
  repeated StepCandidate candidates = 1;
  uint32 chosen = 2;                // index into `candidates`
  repeated float visit_ratio = 3;   // parallel to `candidates`, sums to 1; empty when no search ran
  Decider decider = 4;
  Method method = 5;
  Diagnostics diagnostics = 6;
}

message StepCandidate {
  oneof candidate {
    uint32 index = 1;               // index into DecisionRequest.candidates
    bool done = 2;                  // stop selecting
  }
}

// Who decided (Q7; design: 폴백 검증). Used to validate evaluations: any UNINTENDED_FALLBACK invalidates one.
enum Decider {
  DECIDER_UNSPECIFIED = 0;
  DECIDER_MODEL = 1;                // agent-core's model (policy head and/or search)
  // Intended delegation: the shadow game's Forge AI decided (early stages, e.g. mana payment following Forge AI's plan).
  DECIDER_INTENDED_DELEGATION = 2;
  // Unintended fallback: agent-core did not answer and the adapter's engine AI / default decided.
  // Set only by the adapter, in DecisionRecord.
  DECIDER_UNINTENDED_FALLBACK = 3;
}

// How the model decided (Q7, Q8): the prior plus whether search ran.
message Method {
  Prior prior = 1;
  oneof search {
    SearchRun ran = 2;
    SearchSkipReason skipped = 3;   // decided by the network alone (탐색 생략); not a fallback
  }
}

enum Prior {
  PRIOR_UNSPECIFIED = 0;
  PRIOR_LEARNED_HEAD = 1;
  PRIOR_UNIFORM = 2;
}

// IS-MCTS run (design: 학습 전략과 보상 초기 탐색). Budgets are node counts, never time (Q8).
message SearchRun {
  uint64 nodes = 1;
  uint32 determinizations = 2;      // belief samples searched
  float root_value = 3;
}

// No time-based reason for now (Q8); real-time limits come later, after measurement.
enum SearchSkipReason {
  SEARCH_SKIP_REASON_UNSPECIFIED = 0;
  // Fingerprint mismatch the turn replay could not fix, or the shadow game could not be rebuilt.
  SEARCH_SKIP_REASON_SHADOW_RECOVERY_FAILED = 1;
  // The policy was confident enough to pass without search (Q14; threshold set after measurement).
  SEARCH_SKIP_REASON_POLICY_CONFIDENT = 2;
  // The stage has no search yet (phase 1: random policy, no shadow game).
  SEARCH_SKIP_REASON_NOT_AVAILABLE = 3;
}

// Optional diagnostics (design: "후보별 확률, 가치, 전략별 승률").
message Diagnostics {
  repeated float policy_prob = 1;   // parallel to the step's candidates
  optional float value = 2;         // observation-only value network, win probability for the deciding seat
  repeated StrategyValue strategy_values = 3;
}

message StrategyValue {
  string strategy = 1;              // per-deck strategy name (design: 거시 전략 가치망)
  float win_probability = 2;
}

// Why the adapter fell back (design: 폴백 검증 "폴백 사유").
enum FallbackReason {
  FALLBACK_REASON_UNSPECIFIED = 0;
  FALLBACK_REASON_TIMEOUT = 1;
  FALLBACK_REASON_COMMUNICATION_ERROR = 2;
  FALLBACK_REASON_ILLEGAL_ACTION = 3;
  FALLBACK_REASON_UNSUPPORTED_DECISION_TYPE = 4;
  FALLBACK_REASON_MODEL_NOT_LOADED = 5;
}

// What actually happened for one agent-seat decision, as recorded in the adapter's log (design: 폴백 검증 "결정별 기록";
// Q11). The response is agent-core's message verbatim.
message DecisionRecord {
  DecisionRequest request = 1;
  DecisionResponse response = 2;    // unset when agent-core did not answer
  Decider decider = 3;              // final decider; UNINTENDED_FALLBACK when the adapter decided
  FallbackReason fallback_reason = 4;
  repeated uint32 applied = 5;      // candidate indices actually applied to the game
  string engine_decision = 6;       // engine method name, e.g. Forge PlayerController method
  // Set when the engine refused agent-core's selection (Q15); the decision was asked again (see Rejection). Not a
  // fallback; counted separately.
  string rejection = 7;
}

// A decision of a seat agent-core does not decide for (a Forge AI opponent), for the log (Q11). Its effect on the
// game is in the events.
message OpponentDecision {
  uint32 seat = 1;
  string engine_decision = 2;
  string description = 3;           // engine's description of the choice
}
